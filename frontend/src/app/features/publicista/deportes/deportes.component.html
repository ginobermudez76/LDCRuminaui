<div class="pub-container">
  <header class="page-header indigo">
    <h1>🏆 Deportes</h1>
    <p>Gestiona los deportes registrados en el sistema.</p>
  </header>
  <div class="table-card">
    <p-table
      [value]="items()"
      [paginator]="true"
      [rows]="10"
      styleClass="p-datatable-sm p-datatable-striped"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="caption">
        <div class="table-caption">
          <span class="table-title">Lista de Deportes</span>
          <button
            pButton
            type="button"
            icon="pi pi-plus"
            label="Nuevo Deporte"
            class="p-button-sm"
            (click)="openDialog()"
          ></button>
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th scope="col">Código</th>
          <th scope="col">Imagen</th>
          <th scope="col">Nombre</th>
          <th scope="col">Descripción</th>
          <th scope="col">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.codigo }}</td>
          <td>
            <img *ngIf="item.imagen" [src]="'http://localhost:8000' + item.imagen" class="thumb" alt="Deporte {{ item.nombre }}" />
          </td>
          <td>
            <strong>{{ item.nombre }}</strong>
          </td>
          <td>{{ item.descripcion }}</td>
          <td>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-danger p-button-sm p-button-text"
              (click)="confirmDelete(item.uuid)"
            ></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage"
        ><tr>
          <td colspan="5" class="empty-msg">No hay deportes registrados.</td>
        </tr></ng-template
      >
    </p-table>
  </div>
  <p-dialog
    [(visible)]="showDialog"
    header="Nuevo Deporte"
    [modal]="true"
    [style]="{ width: '480px' }"
  >
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-form">
      <div class="field"><label for="nombre">Nombre *</label><input id="nombre" pInputText formControlName="nombre" /></div>
      <div class="field">
        <label for="descripcion">Descripción</label
        ><textarea id="descripcion" pTextarea formControlName="descripcion" rows="3"></textarea>
      </div>
      <div class="field">
        <label for="imagen_file">Imagen</label
        ><input id="imagen_file" type="file" accept="image/*" (change)="onFileChange($event)" class="file-input" />
      </div>
      <div class="error-wrap" *ngIf="error()">
        <p-message severity="error" [text]="error()!"></p-message>
      </div>
      <div class="modal-footer">
        <button
          pButton
          type="button"
          label="Cancelar"
          class="p-button-text"
          (click)="showDialog = false"
        ></button>
        <button
          pButton
          type="submit"
          label="Guardar"
          icon="pi pi-check"
          [disabled]="form.invalid"
          [loading]="saving()"
        ></button>
      </div>
    </form>
  </p-dialog>
  <p-confirmDialog></p-confirmDialog>
</div>
