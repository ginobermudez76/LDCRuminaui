<div class="pub-container">
  <header class="page-header blue">
    <h1>🌟 Deportistas Destacados</h1>
    <p>Gestiona el reconocimiento de nuestros mejores deportistas.</p>
  </header>
  <div class="table-card">
    <p-table
      [value]="items()"
      [paginator]="true"
      [rows]="10"
      styleClass="p-datatable-sm p-datatable-striped"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="caption">
        <div class="table-caption">
          <span class="table-title">Deportistas Destacados</span>
          <button
            pButton
            type="button"
            icon="pi pi-plus"
            label="Nuevo Deportista"
            class="p-button-sm"
            (click)="openDialog()"
          ></button>
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th scope="col">Código</th>
          <th scope="col">Foto</th>
          <th scope="col">Nombre</th>
          <th scope="col">Deporte</th>
          <th scope="col">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.codigo }}</td>
          <td>
            <img
              *ngIf="item.imagen"
              [src]="'http://localhost:8000' + item.imagen"
              class="thumb round"
              alt="Deportista {{ item.nombre_deportista }}"
            />
          </td>
          <td>
            <strong>{{ item.nombre_deportista }}</strong>
          </td>
          <td>{{ item.deporte?.nombre }}</td>
          <td>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-danger p-button-sm p-button-text"
              (click)="confirmDelete(item.uuid)"
            ></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage"
        ><tr>
          <td colspan="5" class="empty-msg">No hay deportistas registrados.</td>
        </tr></ng-template
      >
    </p-table>
  </div>
  <p-dialog
    [(visible)]="showDialog"
    header="Nuevo Deportista Destacado"
    [modal]="true"
    [style]="{ width: '480px' }"
  >
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-form">
      <div class="field">
        <label for="nombre_deportista">Nombre Completo *</label><input id="nombre_deportista" pInputText formControlName="nombre_deportista" />
      </div>
      <div class="field">
        <label for="deporte_id">Deporte</label>
        <p-select
          id="deporte_id"
          inputId="deporte_id"
          [options]="deportes()"
          optionLabel="nombre"
          optionValue="uuid"
          formControlName="deporte_id"
          [style]="{ width: '100%' }"
        ></p-select>
      </div>
      <div class="field">
        <label for="foto_file">Foto</label
        ><input id="foto_file" type="file" accept="image/*" (change)="onFileChange($event)" class="file-input" />
      </div>
      <div class="error-wrap" *ngIf="error()">
        <p-message severity="error" [text]="error()!"></p-message>
      </div>
      <div class="modal-footer">
        <button
          pButton
          type="button"
          label="Cancelar"
          class="p-button-text"
          (click)="showDialog = false"
        ></button>
        <button
          pButton
          type="submit"
          label="Guardar"
          icon="pi pi-check"
          [disabled]="form.invalid"
          [loading]="saving()"
        ></button>
      </div>
    </form>
  </p-dialog>
  <p-confirmDialog></p-confirmDialog>
</div>
