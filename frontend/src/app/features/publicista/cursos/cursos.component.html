<div class="pub-container">
  <header class="page-header purple">
    <h1>📚 Cursos</h1>
    <p>Administra los cursos deportivos disponibles.</p>
  </header>
  <div class="table-card">
    <p-table
      [value]="items()"
      [paginator]="true"
      [rows]="10"
      styleClass="p-datatable-sm p-datatable-striped"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="caption">
        <div class="table-caption">
          <span class="table-title">Lista de Cursos</span>
          <button
            pButton
            type="button"
            icon="pi pi-plus"
            label="Nuevo Curso"
            class="p-button-sm"
            (click)="openDialog()"
          ></button>
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th scope="col">Código</th>
          <th scope="col">Imagen</th>
          <th scope="col">Nombre</th>
          <th scope="col">Descripción</th>
          <th scope="col">Fecha Inicio</th>
          <th scope="col">Fecha Fin</th>
          <th scope="col">Estado</th>
          <th scope="col">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.codigo }}</td>
          <td>
            <img
              *ngIf="item.imagen"
              [src]="'http://localhost:8000' + item.imagen"
              class="thumb"
              alt="Curso {{ item.nombre }}"
            />
          </td>
          <td>
            <strong>{{ item.nombre }}</strong>
          </td>
          <td>{{ item.descripcion }}</td>
          <td>{{ item.fecha_inicio }}</td>
          <td>{{ item.fecha_fin }}</td>
          <td>
            <span class="estado-badge" [class.activo]="item.estado === 'Activo'">{{
              item.estado
            }}</span>
          </td>
          <td>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-danger p-button-sm p-button-text"
              (click)="confirmDelete(item.uuid)"
            ></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage"
        ><tr>
          <td colspan="8" class="empty-msg">No hay cursos registrados.</td>
        </tr></ng-template
      >
    </p-table>
  </div>
  <p-dialog
    [(visible)]="showDialog"
    header="Nuevo Curso"
    [modal]="true"
    [style]="{ width: '540px' }"
  >
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-form">
      <div class="form-grid">
        <div class="field full">
          <label for="nombre">Nombre *</label
          ><input id="nombre" pInputText formControlName="nombre" />
        </div>
        <div class="field">
          <label for="fecha_inicio">Fecha Inicio</label
          ><input id="fecha_inicio" type="date" pInputText formControlName="fecha_inicio" />
        </div>
        <div class="field">
          <label for="fecha_fin">Fecha Fin</label
          ><input id="fecha_fin" type="date" pInputText formControlName="fecha_fin" />
        </div>
        <div class="field full">
          <label for="deporte_id">Deporte</label>
          <p-select
            id="deporte_id"
            inputId="deporte_id"
            [options]="deportes()"
            optionLabel="nombre"
            optionValue="uuid"
            formControlName="deporte_id"
            [style]="{ width: '100%' }"
          ></p-select>
        </div>
        <div class="field full">
          <label for="descripcion">Descripción</label
          ><input id="descripcion" pInputText formControlName="descripcion" />
        </div>
        <div class="field">
          <label for="estado">Estado</label>
          <p-select
            id="estado"
            inputId="estado"
            [options]="['Activo', 'Inactivo']"
            formControlName="estado"
            [style]="{ width: '100%' }"
          ></p-select>
        </div>
        <div class="field">
          <label for="inscripciones">Inscripciones</label>
          <p-select
            id="inscripciones"
            inputId="inscripciones"
            [options]="['Activo', 'Inactivo']"
            formControlName="inscripciones"
            [style]="{ width: '100%' }"
          ></p-select>
        </div>
        <div class="field full">
          <label for="imagen_file">Imagen</label
          ><input
            id="imagen_file"
            type="file"
            accept="image/*"
            (change)="onFileChange($event)"
            class="file-input"
          />
        </div>
      </div>
      <div class="error-wrap" *ngIf="error()">
        <p-message severity="error" [text]="error()!"></p-message>
      </div>
      <div class="modal-footer">
        <button
          pButton
          type="button"
          label="Cancelar"
          class="p-button-text"
          (click)="showDialog = false"
        ></button>
        <button
          pButton
          type="submit"
          label="Guardar"
          icon="pi pi-check"
          [disabled]="form.invalid"
          [loading]="saving()"
        ></button>
      </div>
    </form>
  </p-dialog>
  <p-confirmDialog></p-confirmDialog>
</div>
